<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한코한단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF0DC; --surface:#FBFCF4; --surface-2:#F2F4E3; --ink:#273020; --ink-2:#66705A; --line:#D8DDC0;
  --accent:#5B7A2E; --accent-ink:#FBFCF4; --accent-soft:#E1E9C8;
  --mark:#B07A44; --mark-soft:rgba(176,122,68,.22); --good:#4F7A3A; --good-soft:#DCE8CD; --warn:#9A5A2A; --warn-soft:#F3E3D0;
  --cell:22px; --radius:14px;
  --f-display:"Hahmlet","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#191E15; --surface:#222A1C; --surface-2:#2A3323; --ink:#EAEEDC; --ink-2:#A3AC91; --line:#37412E;
    --accent:#B5CC6E; --accent-ink:#1A2012; --accent-soft:#33401F;
    --mark:#D9A46C; --mark-soft:rgba(217,164,108,.24); --good:#9CC57A; --good-soft:#26361C; --warn:#E6A877; --warn-soft:#3A2A1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#191E15; --surface:#222A1C; --surface-2:#2A3323; --ink:#EAEEDC; --ink-2:#A3AC91; --line:#37412E;
    --accent:#B5CC6E; --accent-ink:#1A2012; --accent-soft:#33401F;
    --mark:#D9A46C; --mark-soft:rgba(217,164,108,.24); --good:#9CC57A; --good-soft:#26361C; --warn:#E6A877; --warn-soft:#3A2A1A;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;margin:0}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.bar .sp{flex:1}
.bar h1.pname{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.muted{color:var(--ink-2)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
.notice{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* list */
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.card:hover{border-color:var(--ink-2)}
.card h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card .pos{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:calc(100% - 16px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet h2{font-family:var(--f-display);margin:0;font-size:21px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field textarea,textarea.plain{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row-f{display:flex;gap:16px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-2);background:var(--surface-2);position:relative}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:92px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;position:relative;font-size:11px;display:grid;place-items:end center;padding:4px;color:var(--ink-2)}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* project */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

.counter{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.counter{grid-template-columns:1.25fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.rowpanel{display:flex;flex-direction:column;gap:12px}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum .n{font-family:var(--f-display);font-weight:800;font-size:84px;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bignum .of{font-family:var(--f-num);font-size:18px;color:var(--ink-2)}
.bignum .u{font-family:var(--f-display);font-size:26px;font-weight:700}
.instr{font-size:16px;line-height:1.5;border-left:3px solid var(--mark);padding:4px 0 4px 12px;background:linear-gradient(90deg,var(--mark-soft),transparent 70%);border-radius:2px}
.instr .r{font-family:var(--f-num);font-size:12px;color:var(--ink-2);display:block}
.pad{display:grid;grid-template-columns:1fr 2.2fr;gap:8px}
.tap{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:16px 10px;font-weight:600;font-size:17px;touch-action:manipulation;user-select:none}
.tap.big{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:20px;padding:22px 10px}
.tap:active{transform:scale(.98)}
.stpanel{display:flex;flex-direction:column;gap:10px}
.stnum{display:flex;align-items:baseline;gap:8px}
.stnum .n{font-family:var(--f-num);font-weight:600;font-size:44px;line-height:1}
.stbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stbtns .tap{padding:12px 4px;font-size:15px}
.stbtns .tap.plus{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.minirow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.aux{display:flex;align-items:center;gap:8px}
.aux .n{font-family:var(--f-num);font-size:22px;min-width:2.5ch;text-align:center}
.next{font-size:14px;color:var(--ink-2)}
.next b{color:var(--ink);font-weight:600}
.secbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.done-banner{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}

/* chart */
.chart-wrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px}
.chart{display:grid;gap:1px;width:max-content;font-family:var(--f-num);font-size:11px}
.cc{width:var(--cell);height:var(--cell);display:grid;place-items:center;background:var(--surface);color:var(--ink);font-size:12px;line-height:1;outline:1px solid var(--line)}
.cc.rn{background:transparent;outline:0;color:var(--ink-2);font-size:10.5px;width:26px}
.cc.cn{background:transparent;outline:0;color:var(--ink-2);font-size:9.5px;height:16px}
.cc.cur-row{box-shadow:inset 0 0 0 999px var(--mark-soft)}
.cc.cur-cell{outline:2.5px solid var(--mark);z-index:1;position:relative;font-weight:700}
.cc.rn.cur-row{color:var(--ink);font-weight:700;box-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cc{outline:1px solid var(--line)}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chart-title h3{font-family:var(--f-display);margin:0;font-size:17px}

/* pattern tab */
.stack{display:flex;flex-direction:column;gap:14px}
.sec h3{font-family:var(--f-display);font-size:17px;margin:0 0 8px}
.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.steps li{border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:88px 1fr auto;gap:10px;padding:10px 12px;width:100%;cursor:pointer;align-items:baseline}
.steps button:hover{background:var(--surface-2)}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.steps .rg{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.steps .sc{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.steps li.on button{background:var(--mark-soft)}
.steps li.seghead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--surface-2);font-weight:600;font-size:13.5px}
.steps li.seghead .num{font-weight:400;color:var(--ink-2);font-size:12px}
.segitem{display:grid;grid-template-columns:88px 1fr auto;gap:10px;padding:8px 12px;align-items:center}
.segstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.sgp{flex:none;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.sgp.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.sgp.cur{background:var(--mark-soft);color:var(--ink);border-color:var(--mark);font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.warnbox ul{margin:6px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.srcimgs{display:flex;gap:8px;overflow-x:auto}
.srcimgs img{height:160px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.analyzing{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"…"}.tap:active{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:640px){.kbd{display:none}}
.foot{margin-top:28px;font-size:12px;color:var(--ink-2)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}.kbd{display:none}
.setting-key{font-family:var(--f-num);font-size:13px;color:var(--ink-2)}
select.plain{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;width:100%;max-width:420px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="bar"><p class="brand">한코한단</p></div><p class="muted">불러오는 중…</p></div>
<input type="file" id="hiddenFile" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" multiple hidden>
<input type="file" id="importFile" accept="application/json,text/plain,application/octet-stream" hidden>

<script src="config.js"></script>
<script>
(() => {
"use strict";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS_KEY = "hanko.projects.v1", LS_UI = "hanko.ui.v1";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const int = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
const str = v => (v == null ? "" : String(v)).trim();
const arr = v => Array.isArray(v) ? v : [];

const ui0 = lsGet(LS_UI) || {};
const S = {
  mode: "loading", db: null, sample: null, imgCaps: null, assets: null,
  projects: [], view: "list", openId: ui0.openId || null, tab: "count", filter: ui0.filter || "active",
  analyzing: {}, blobs: {}, hist: {}, wake: null, confirmDel: false,
  sheet: null, pendingRender: false,
};
const saveUi = () => lsSet(LS_UI, { openId: S.view === "project" ? S.openId : null, filter: S.filter });

/* ---------------- storage ---------------- */
const timers = {}, writing = {}, again = {}, dirty = new Set();
function serialize(p) { const { id, ...rest } = p; return JSON.parse(JSON.stringify(rest)); }
function persist(p, now) {
  p.updatedAt = Date.now();
  dirty.add(p.id);
  clearTimeout(timers[p.id]);
  if (now) flush(p.id); else timers[p.id] = setTimeout(() => flush(p.id), 600);
}
function saveAll() { return Bridge.saveState(JSON.stringify({ v: 2, projects: S.projects, tombs: S.tombs })); }
async function flush(id) {
  clearTimeout(timers[id]);
  const ok = saveAll();
  if (!ok) toast("저장하지 못했어요. 저장 공간을 확인해 주세요.");
  dirty.delete(id);
  scheduleSync();
}
async function removeProject(id) {
  const p = S.projects.find(x => x.id === id);
  (p && p.imageIds || []).forEach(f => Files.del(f));
  S.projects = S.projects.filter(x => x.id !== id);
  S.tombs[id] = Date.now();
  saveAll();
  scheduleSync();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) [...dirty].forEach(flush);
  else syncNow();
});
window.__flushAll = () => [...dirty].forEach(flush);

/* ---------------- 플랫폼 (안드로이드 앱 / 웹) ---------------- */
const IS_ANDROID = !!window.AndroidBridge;
const Bridge = window.AndroidBridge || (() => {
  const g = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
  const p = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
  return {
    loadState: () => g("hanko.app.state"), saveState: j => p("hanko.app.state", j),
    getPref: k => g("hanko.pref." + k), setPref: (k, v) => p("hanko.pref." + k, v),
    keepScreenOn: () => {}, openExternal: u => { location.href = u; }, takePendingLink: () => "",
    exportBackup: (name, json) => {
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name;
        document.body.appendChild(a); a.click(); a.remove(); return "ok";
      } catch (e) { return String(e); }
    },
  };
})();
/* 도안 파일: 안드로이드는 앱 저장소, 웹은 IndexedDB */
const Files = IS_ANDROID ? {
  get: async id => { try { return window.AndroidBridge.loadFile(id) || ""; } catch { return ""; } },
  put: async (id, b64) => { try { return window.AndroidBridge.saveFile(id, b64); } catch { return false; } },
  del: async id => { try { window.AndroidBridge.deleteFile(id); } catch {} },
} : (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("hanko", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("files", mode); const q = fn(t.objectStore("files"));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    get: id => run("readonly", st => st.get(id)).then(v => v || "").catch(() => ""),
    put: (id, b64) => run("readwrite", st => st.put(b64, id)).then(() => true).catch(() => false),
    del: id => run("readwrite", st => st.delete(id)).catch(() => {}),
  };
})();
const httpWait = {}; let httpSeq = 0;
window.__httpDone = (id, status, body) => { const f = httpWait[id]; if (f) { delete httpWait[id]; f({ status, body }); } };
function http(method, url, headers, body) {
  if (IS_ANDROID) return new Promise(res => { const id = "h" + (++httpSeq); httpWait[id] = res; Bridge.http(id, method, url, JSON.stringify(headers || {}), body || ""); });
  return fetch(url, { method, headers: headers || {}, body: body || undefined })
    .then(async r => ({ status: r.status, body: await r.text() }))
    .catch(e => ({ status: 0, body: JSON.stringify({ error: { type: "network", message: String(e) } }) }));
}
const pref = k => { try { return Bridge.getPref(k) || ""; } catch { return ""; } };
const setPref = (k, v) => { try { Bridge.setPref(k, v || ""); } catch {} };
function toB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); });
}
function fromB64(b64, type) {
  const bin = atob(b64); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type });
}
function apiHeaders() { return { "x-api-key": pref("apiKey"), "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" }; }
function apiError(status, body) {

      }

    });

  }).filter(c => c.width && c.height);

    steps: arr(s && s.steps).map(st => {

        chart: chId && charts.some(c => c.id === chId) ? { id: chId, startRow: Math.max(1, int(st.chart.startRow) || 1) } : null };

  })).filter(s => s.steps.length);
  const m = d.materials || {};

    else if (size.index && size.index !== pos) warns.unshift(`사이즈 순번이 맞지 않아요 (${size.chosen}는 ${pos}번째인데 ${size.index}번째 값을 썼다고 답했어요). 숫자를 원본과 대조해 주세요.`);

function analysisPrompt(p, nImages, pdfNote) {
  return `당신은 뜨개질 도안(대바늘/코바늘)을 정확하게 읽는 분석가입니다. 사용자는 이 결과로 단수와 코수를 세며 실제로 뜨개를 합니다.
첨부: 도안 파일(이미지·PDF) ${nImages}개${pdfNote ? " (" + pdfNote + ")" : ""}${p.sourceText ? ", 아래 도안 텍스트" : ""}.
사용자 설정: ${p.craft === "crochet" ? "코바늘" : "대바늘"}, ${p.mode === "round" ? "원형(원통)뜨기" : "평면뜨기"} (도안이 다르게 말하면 도안을 따르고 warnings에 적기).

사이즈: ${p.size ? `사용자가 뜨려는 사이즈는 "${p.size}"입니다. 모든 단수·콧수·치수는 이 사이즈 값만 쓰세요.` : "사용자가 사이즈를 정하지 않았습니다. 여러 사이즈 도안이면 1번(맨 왼쪽) 사이즈로 분석하세요."}
여러 사이즈 도안 읽는 법:
- 사이즈 줄(예: "사이즈: XXS (XS) S (M) L (XL) 2XL (3XL) 4XL (5XL)")은 괄호 안팎을 가리지 않고 왼쪽부터 1번, 2번, 3번… 사이즈입니다. 이 예에서 XXS=1번, XS=2번(첫 번째 괄호), S=3번, M=4번(두 번째 괄호), L=5번 …
- 도안 곳곳의 "82 (87) 92 (98) 102 (112) 122 (132) 142 (152)"처럼 같은 형식으로 나열된 숫자는, 선택한 사이즈와 같은 순번의 값 하나만 쓰세요. 위 예에서 XS(2번)면 87, M(4번)이면 98.
- 숫자가 하나만 적혀 있으면 모든 사이즈 공통 값입니다.
- 순번 값이 0, "-", "–"이면 그 사이즈는 해당 지시를 하지 않습니다. 그 step은 넣지 말고 warnings에 어떤 지시를 뺐는지 적으세요.
- 나열된 값 개수가 사이즈 수와 맞지 않으면(일부 사이즈만 묶인 표기 등) 순번을 추측하지 말고 해당 step의 stitches는 null, warnings에 위치를 적으세요.
- text에도 선택한 사이즈의 숫자만 쓰세요. "82 (87) 92…" 숫자열을 그대로 옮기지 마세요.
- 사용자가 고른 사이즈가 사이즈 줄에 없으면 chosen은 null로 두고 1번 사이즈로 분석한 뒤 warnings에 적으세요.
- size.measurements에는 완성 치수 표에서 선택한 사이즈 값만 적으세요. 사용자가 올바른 열을 골랐는지 확인하는 데 씁니다.

규칙:
1. 도안에 없는 내용을 지어내지 마세요. 흐리거나 잘리거나 모호한 부분은 추측으로 채우지 말고 warnings에 구체적으로(어느 부위, 몇 단) 적으세요.
2. 같은 지시가 이어지는 단은 한 step으로 묶으세요 (예: 5~40단 "4단마다 양끝 1코 줄이기"). (사이즈별 숫자는 아래 "사이즈" 규칙을 따르세요.)
3. "원하는 길이까지" 같이 단수가 정해지지 않은 구간은 도안에 적힌 cm와 게이지로 단수를 계산할 수 있을 때만 계산하고, 계산했다면 text에 "(게이지로 계산한 추정)"이라고 표시하세요. 계산할 수 없으면 적당한 범위를 넣지 말고 한 단짜리 step으로 두고 warnings에 적으세요.
4. 차트: 도안의 차트를 칸 단위로 옮기되, 가로 60칸·세로 80단을 넘으면 확실히 읽히는 반복 단위만 옮기고 warnings에 적으세요. 코가 없는 칸(no stitch)은 key "_"로 정의하세요. 공백 문자는 key로 쓰지 마세요. 대바늘 평면뜨기 차트는 보통 "rtl-alt"(홀수단 오른쪽→왼쪽), 원형뜨기는 "rtl". 차트가 없는 도안이면 charts와 legend는 빈 배열.
5. 단 번호: from/to는 한 부위 안에서 끊기지 않고 이어지는 통합 단 번호로 적으세요. 도안이 "요크 1~24단", "소매 늘리기 1~30단"처럼 구간마다 단을 새로 센다면, 통합 번호로 환산해 from/to에 넣고 그 구간 이름을 segment에 넣으세요 (앱이 구간별 번호로 다시 보여줍니다). 도안에 구간 이름이 없어도 코잡기·고무뜨기·늘리기·줄이기·무늬처럼 작업이 바뀌는 곳마다 짧은 segment 이름을 붙이세요.
6. 배색 차트면 legend.color에 색을 넣고, 아니면 null.
7. 답은 JSON 객체 하나만. 설명 문장 없이. 불필요하게 길게 쓰지 마세요.

스키마:
${SCHEMA}
${p.sourceText ? "\n도안 텍스트:\n\"\"\"\n" + p.sourceText.slice(0, 30000) + "\n\"\"\"" : ""}`;

const IMG_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif"];
function canvasBlob(c, q = 0.86) { return new Promise(r => c.toBlob(b => r(b), "image/jpeg", q)); }
async function shrink(blob, max = 1800) {
  try {
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && blob.size < 1.5e6) return blob;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return await canvasBlob(c);
  } catch { return blob; }
}
async function ingestFiles(files) {
  const out = { blobs: [], text: "", notes: [] };
  for (const f of files) {
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      if (f.size > 30 * 1024 * 1024) { out.notes.push(`${f.name}: 30MB가 넘어서 보낼 수 없어요. 필요한 쪽만 나눠 올려 주세요.`); continue; }
      out.blobs.push(new Blob([f], { type: "application/pdf" }));
    } else if (IMG_TYPES.includes(f.type)) out.blobs.push(await shrink(f));
    else out.notes.push(`${f.name}: 지원하지 않는 형식이에요 (JPG·PNG·WEBP·GIF·PDF).`);
  }
  return out;
}
async function blobsFor(p) {
  if (S.blobs[p.id] && S.blobs[p.id].length) return S.blobs[p.id];
  const got = [];
  for (const id of p.imageIds || []) {
    const b64 = await Files.get(id);
    if (b64) got.push(fromB64(b64, (p.fileTypes || {})[id] || "image/jpeg"));
  }
  S.blobs[p.id] = got;
  return got;
}
async function uploadImages(p, blobs) {
  p.imageIds = p.imageIds || []; p.fileTypes = p.fileTypes || {};
  for (const b of blobs) {
    const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const ok = await Files.put(id, await toB64(b));
    if (!ok) { toast("도안 파일 일부를 저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요."); break; }
    p.imageIds.push(id); p.fileTypes[id] = b.type || "image/jpeg";
  }
  persist(p, true);
  render();
}
const thumbCache = {};
function fillThumbs() {
  const p = cur(); if (!p) return;
  document.querySelectorAll("img[data-file]").forEach(async img => {
    const id = img.dataset.file;
    if (!thumbCache[id]) { const b64 = await Files.get(id); thumbCache[id] = b64 ? `data:${(p.fileTypes || {})[id] || "image/jpeg"};base64,${b64}` : "-"; }
    if (thumbCache[id] === "-") img.hidden = true; else img.src = thumbCache[id];
  });
}

async function analyze(p, fixRequest) {
  if (!S.sample || S.analyzing[p.id]) return;
  const ctl = new AbortController();
  const a = S.analyzing[p.id] = { ctl, chars: 0, t0: Date.now(), status: fixRequest ? "수정 반영 중" : "Claude가 도안 읽는 중", error: null };
  render();
  try {
    let blobs = await blobsFor(p);
    let note = "";
    if (blobs.length && !S.imgCaps) { blobs = []; note = "이미지 전송 불가"; }
    if (S.imgCaps && blobs.length > S.imgCaps.maxCount) { note = `${blobs.length}장 중 ${S.imgCaps.maxCount}장만 전송`; blobs = blobs.slice(0, S.imgCaps.maxCount); }
    if (!fixRequest && !blobs.length && !p.sourceText) throw { code: "no_source" };
    const prompt = fixRequest ? fixPrompt(p, fixRequest) : analysisPrompt(p, blobs.length, note);
    const opts = { signal: ctl.signal, cache: false, modelTier: "default", onText: ({ text }) => { a.chars = text.length; a.status = "차트 만드는 중"; paintAnalyzing(p.id); } };
    if (blobs.length) opts.images = blobs;
    const raw = await S.sample.json(prompt, opts);
    const pat = normalize(raw, p.size);
    if (!pat.sections.length && !pat.charts.length) throw { code: "empty_result" };
    if (note) pat.warnings.push("원본 이미지 " + note + " — 뒷부분은 분석에 포함되지 않았어요.");
    const hadPattern = !!p.pattern;
    p.pattern = pat;
    if (!hadPattern) { if (pat.craft) p.craft = pat.craft; if (pat.mode) p.mode = pat.mode; if (pat.title && /^새 프로젝트/.test(p.name)) p.name = pat.title; }
    prog(p); if (prog(p).sec >= pat.sections.length) prog(p).sec = 0;
    persist(p, true);
    delete S.analyzing[p.id];
    toast(fixRequest ? "수정했어요." : "차트 도안을 만들었어요.");
    S.tab = fixRequest ? "pattern" : "count";
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") { delete S.analyzing[p.id]; }
    else {
      a.error = code === "no_source" ? "분석할 도안이 없어요. 이미지·PDF를 추가하거나 텍스트를 붙여 넣어 주세요."
        : code === "empty_result" ? "도안에서 단 정보를 찾지 못했어요. 더 선명한 이미지나 텍스트로 다시 시도해 주세요."
        : SAMPLE_ERR[code] || "분석 중 연결이 끊겼어요. 다시 시도해 주세요.";
      a.ctl = null;
    }
  }
  render();
}
function paintAnalyzing(id) {
  const el = document.querySelector(`[data-analyzing="${id}"]`);
  const a = S.analyzing[id];
  if (el && a) el.textContent = a.status + ` · ${Math.round((Date.now() - (a.t0 || Date.now())) / 1000)}초`;
}

  importData() { document.getElementById("importFile").click(); },
  open(id) { S.openId = id; S.view = "project"; S.tab = "count"; S.confirmDel = false; saveUi(); render(); window.scrollTo(0, 0); },
  back() { S.view = "list"; saveUi(); render(); },
  filter(v) { S.filter = v; saveUi(); render(); },
  tab(v) { S.tab = v; S.confirmDel = false; render(); },
  newp() { S.sheet = { name: "", craft: "knit", mode: "flat", rowMode: "total", text: "", files: [], busy: false }; render(); },
  closeSheet() { S.sheet = null; render(); },
  rowPlus() { const p = cur(); pushHist(p); setRow(p, curRow(p) + 1); prog(p).stitch = 0; persist(p); render(); },
  rowMinus() { const p = cur(); if (curRow(p) <= 1) return; pushHist(p); setRow(p, curRow(p) - 1); prog(p).stitch = 0; persist(p); render(); },
  st(n) { const p = cur(); pushHist(p); const g = prog(p); g.stitch = Math.max(0, g.stitch + Number(n)); persist(p); render(); },
  stReset() { const p = cur(); pushHist(p); prog(p).stitch = 0; persist(p); render(); },
  aux(n) { const p = cur(); pushHist(p); const g = prog(p); g.aux = n === "0" ? 0 : Math.max(0, g.aux + Number(n)); persist(p); render(); },
  undo() { const p = cur(); const h = S.hist[p.id]; if (!h || !h.length) return; p.progress = JSON.parse(h.pop()); persist(p); render(); },
  sec(i) { const p = cur(); pushHist(p); prog(p).sec = Number(i); prog(p).stitch = 0; persist(p); render(); },
  jump(v) { const [si, row] = v.split(":").map(Number); const p = cur(); pushHist(p); const g = prog(p); g.sec = si; g.rows[si] = row; g.stitch = 0; persist(p); S.tab = "count"; render(); window.scrollTo(0, 0); },
  nextSec() { const p = cur(); const g = prog(p); if (g.sec < sectionsOf(p).length - 1) { pushHist(p); g.sec++; g.stitch = 0; persist(p); render(); } },
  status() { const p = cur(); p.status = p.status === "done" ? "active" : "done"; persist(p, true); toast(p.status === "done" ? "완성! 완료 목록으로 옮겼어요." : "다시 진행 중으로 옮겼어요."); render(); },
  wake() { toggleWake(); },
  analyze() { const p = cur(); if (S.analyzing[p.id] && S.analyzing[p.id].error) delete S.analyzing[p.id]; analyze(p); },
  stop() { const p = cur(); const a = S.analyzing[p.id]; if (a && a.ctl) a.ctl.abort(); },
  dismissErr() { delete S.analyzing[cur().id]; render(); },
  fix() { const p = cur(); const ta = document.getElementById("fixReq"); const v = ta && ta.value.trim(); if (!v) { toast("무엇을 고칠지 적어 주세요."); return; } if (S.analyzing[p.id]) delete S.analyzing[p.id]; analyze(p, v); },
  addSrc() { document.getElementById("hiddenFile").dataset.target = "project"; document.getElementById("hiddenFile").click(); },
  del() { if (!S.confirmDel) { S.confirmDel = true; render(); return; } const id = S.openId; S.confirmDel = false; S.view = "list"; removeProject(id); saveUi(); toast("삭제했어요."); render(); },
  craft(v) { if (S.sheet) { S.sheet.craft = v; render(); } else { const p = cur(); p.craft = v; persist(p); render(); } },
  mode(v) { if (S.sheet) { S.sheet.mode = v; render(); } else { const p = cur(); p.mode = v; persist(p); render(); } },
  pickSize(v) { const p = cur(); p.size = v; persist(p, true); render(); },
  rowMode(v) { if (S.sheet) { S.sheet.rowMode = v; render(); } else { const p = cur(); p.rowMode = v; persist(p); render(); } },
  segForm() { S.segForm = !S.segForm; render(); if (S.segForm) setTimeout(() => { const i = document.getElementById("segName"); if (i) i.focus(); }, 0); },
  addSeg() {
    const p = cur(), n = document.getElementById("segName"), r = document.getElementById("segRows");
    const name = n && n.value.trim(); if (!name) { toast("구간 이름을 적어 주세요."); return; }
    const g = prog(p), row = curRow(p);
    p.manualSegs = (p.manualSegs || []).filter(m => !((m.sec || 0) === g.sec && m.from === row));
    p.manualSegs.push({ id: uid(), sec: g.sec, name: name.slice(0, 40), from: row, rows: int(r && r.value) || null });
    if (p.rowMode !== "segment") p.rowMode = "segment";
    S.segForm = false; persist(p, true); toast(`${row}단부터 '${name}' 구간을 시작해요.`); render();
  },
  delSeg(id) { const p = cur(); p.manualSegs = (p.manualSegs || []).filter(m => m.id !== id); persist(p, true); render(); },
  rmFile(i) { S.sheet.files.splice(Number(i), 1); render(); },
  pickFiles() { document.getElementById("hiddenFile").dataset.target = "sheet"; document.getElementById("hiddenFile").click(); },
  create(v) { createProject(v === "analyze"); },
};

async function createProject(withAnalysis) {
  const sh = S.sheet; if (!sh || sh.busy) return;
  syncSheetInputs();
  sh.busy = true; sh.msg = sh.files.length ? "도안 파일 준비 중…" : ""; render();
  const p = { id: uid(), name: sh.name.trim() || "새 프로젝트 " + (S.projects.length + 1), craft: sh.craft, mode: sh.mode, rowMode: sh.rowMode || "total", manualSegs: [],
    status: "active", createdAt: Date.now(), updatedAt: Date.now(), pattern: null, imageIds: [], sourceText: "",
    notes: "", size: str(sh.size).slice(0, 20), targetRows: int(sh.target) || null, progress: { sec: 0, rows: { 0: 1 }, stitch: 0, aux: 0 } };
  let ing = { blobs: [], text: "", notes: [] };
  if (sh.files.length) ing = await ingestFiles(sh.files);
  p.sourceText = [sh.text.trim(), ing.text].filter(Boolean).join("\n\n").slice(0, 40000);
  S.blobs[p.id] = ing.blobs;
  S.projects.unshift(p);
  persist(p, true);
  ing.notes.forEach(n => toast(n));
  S.sheet = null; S.openId = p.id; S.view = "project"; S.tab = withAnalysis ? "pattern" : "count"; saveUi();
  render();
  if (ing.blobs.length) uploadImages(p, ing.blobs);
  if (withAnalysis) analyze(p);
}
function syncSheetInputs() {
  if (!S.sheet) return;
  const n = document.getElementById("sName"), t = document.getElementById("sText"), g = document.getElementById("sTarget"), z = document.getElementById("sSize");
  if (z) S.sheet.size = z.value;
  if (n) S.sheet.name = n.value; if (t) S.sheet.text = t.value; if (g) S.sheet.target = g.value;
}

/* file input + drag/drop */
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let list;
  try { const j = JSON.parse(await f.text()); list = Array.isArray(j) ? j : j.projects; } catch { list = null; }
  if (!Array.isArray(list)) { toast("한코한단 백업 파일이 아니에요."); return; }
  let added = 0, updated = 0;
  list.forEach(p => {
    if (!p || typeof p !== "object" || !/^[A-Za-z0-9_-]{1,60}$/.test(String(p.id || ""))) return;
    const i = S.projects.findIndex(x => x.id === p.id);
    if (i < 0) { S.projects.push(p); added++; }
    else if ((p.updatedAt || 0) > (S.projects[i].updatedAt || 0)) { S.projects[i] = p; updated++; }
  });
  saveAll(); scheduleSync();
  toast(`새 프로젝트 ${added}개, 업데이트 ${updated}개를 가져왔어요.`);
  render();
});
document.getElementById("hiddenFile").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;
  if (e.target.dataset.target === "sheet" && S.sheet) { syncSheetInputs(); S.sheet.files.push(...files); render(); return; }
  const p = cur(); if (!p) return;
  toast("도안 파일 준비 중…");
  const ing = await ingestFiles(files);
  ing.notes.forEach(n => toast(n));
  S.blobs[p.id] = (await blobsFor(p)).concat(ing.blobs);
  if (ing.text) p.sourceText = ((p.sourceText || "") + "\n\n" + ing.text).slice(0, 40000);
  persist(p, true);
  if (ing.blobs.length) await uploadImages(p, ing.blobs);
  render();
});
$app.addEventListener("dragover", e => { const d = e.target.closest(".drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
$app.addEventListener("dragleave", e => { const d = e.target.closest(".drop"); if (d) d.classList.remove("over"); });
$app.addEventListener("drop", e => {
  const d = e.target.closest(".drop"); if (!d || !S.sheet) return;
  e.preventDefault(); syncSheetInputs(); S.sheet.files.push(...e.dataTransfer.files); render();
});
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const [k, v] = [b.dataset.act, b.dataset.v];
  if (S.sheet && k !== "closeSheet") syncSheetInputs();
  if (ACT[k]) ACT[k](v);
});
document.addEventListener("click", e => { if (e.target.classList && e.target.classList.contains("sheet-bg")) ACT.closeSheet(); });
let noteT;
$app.addEventListener("change", e => {
  if (e.target.id === "modelSel") { setPref("model", e.target.value); S.sample = pref("apiKey") && pref("model") ? apiSample : null; toast("모델을 바꿨어요."); }
});
$app.addEventListener("input", e => {
  if (S.sheet) {
    syncSheetInputs();
    const has = S.sheet.files.length || (S.sheet.text || "").trim();
    const ab = document.querySelector('[data-act="create"][data-v="analyze"]'); if (ab && !S.sheet.busy) ab.disabled = !has;
    const bb = document.querySelector('[data-act="create"][data-v="blank"]'); if (bb) bb.textContent = has ? "분석 없이 만들기" : "빈 카운터로 만들기";
    return;
  }
  const p = cur();
  if (e.target.id === "notes" && p) { clearTimeout(noteT); p.notes = e.target.value; noteT = setTimeout(() => persist(p), 300); }
  if (e.target.id === "pName" && p) { p.name = e.target.value; persist(p); const h = document.querySelector(".pname"); if (h) h.textContent = p.name || "이름 없음"; }
  if (e.target.id === "pSize" && p) { p.size = e.target.value.trim().slice(0, 20); persist(p); }
  if (e.target.id === "pTarget" && p) { p.targetRows = int(e.target.value); persist(p); }
});
$app.addEventListener("focusout", () => { if (S.pendingRender) setTimeout(() => { if (!isTyping()) { S.pendingRender = false; render(); } }, 0); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.target.id === "segName" || e.target.id === "segRows")) { e.preventDefault(); ACT.addSeg(); return; }
  if (S.view !== "project" || S.tab !== "count" || isTyping() || S.sheet) return;
  if (e.key === "ArrowUp") { e.preventDefault(); ACT.rowPlus(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); ACT.rowMinus(); }
  else if (e.key === "ArrowRight" || e.key === "+") { e.preventDefault(); ACT.st(1); }
  else if (e.key === "ArrowLeft" || e.key === "-") { e.preventDefault(); ACT.st(-1); }
});
function isTyping() { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "file")); }

/* ---------------- render ---------------- */
const CRAFT = { knit: "대바늘", crochet: "코바늘" }, MODE = { flat: "평면", round: "원형" };
const sizeLabel = p => (p.pattern && p.pattern.size && p.pattern.size.chosen) || p.size || "";
const ROWMODE = { total: "통합 단", segment: "구간별 단" };
const ROWMODE_HELP = { total: "부위 안에서 1단부터 끝까지 이어서 세요.", segment: "'요크 늘리기 12단'처럼 구간마다 1단부터 새로 세요." };
function render(fromSnapshot) {
  if (fromSnapshot && isTyping()) { S.pendingRender = true; return; }
  let html = "";
  if (S.view === "settings") html = viewSettings();
  else if (S.view === "project" && cur()) html = viewProject(cur());
  else { S.view = "list"; html = viewList(); }
  $app.innerHTML = html + (S.sheet ? viewSheet() : "");
  if (S.view === "project") { scrollChart(); fillThumbs(); }
}
function seg(act, val, opts) {
  return `<div class="seg" role="group">${Object.entries(opts).map(([k, l]) => `<button type="button" data-act="${act}" data-v="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</div>`;
}

function viewList() {
  const act = S.projects.filter(p => p.status !== "done"), done = S.projects.filter(p => p.status === "done");
  const shown = (S.filter === "done" ? done : S.filter === "all" ? S.projects : act).slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const cards = shown.map(p => {
    const pc = percent(p), secs = sectionsOf(p), g = prog(p), sec = secs[g.sec];
    const st = p.status === "done" ? `<span class="pill good">완료</span>`
      : S.analyzing[p.id] && !S.analyzing[p.id].error ? `<span class="pill accent">분석 중</span>`
      : p.pattern ? `<span class="pill accent">차트 있음</span>` : `<span class="pill">카운터만</span>`;
    const tot = secTotal(p, sec), row = curRow(p);
    const sg = p.rowMode === "segment" ? segAt(segmentsOf(p, sec, g.sec), row) : null;
    const posTxt = sg && !sg.implicit
      ? `${secs.length > 1 ? esc(sec.name) + " · " : ""}${esc(sg.name)} <span class="num">${segLocal(sg, row)}</span>단${segLen(sg) ? `<span class="num"> / ${segLen(sg)}</span>` : ""}`
      : `${secs.length > 1 || !sec.manual ? esc(sec.name) + " · " : ""}<span class="num">${row}</span>단${tot ? `<span class="num"> / ${tot}</span>` : ""}`;
    return `<button class="card" data-act="open" data-v="${esc(p.id)}">
      <h3>${esc(p.name || "이름 없음")}</h3>
      <div class="meta">${st}${sizeLabel(p) ? `<span class="pill">${esc(sizeLabel(p))}</span>` : ""}<span class="pill">${CRAFT[p.craft] || "대바늘"} · ${MODE[p.mode] || "평면"}</span></div>
      ${pc != null ? `<div class="prog" aria-label="진행률 ${pc}%"><i style="width:${pc}%"></i></div>` : ""}
      <div class="pos"><span>${posTxt}</span><span class="num">${pc != null ? pc + "%" : ""}</span></div>
    </button>`;
  }).join("");
  const modeNote = S.mode === "local" ? `<p class="notice">이 화면에서는 저장소에 연결되지 않아 프로젝트가 이 브라우저에만 저장돼요.</p>` : "";
  return `<div class="bar"><p class="brand">한코한단 <small>뜨개 카운터</small></p><span class="sp"></span>
      ${Sync.session ? `<button class="chip" data-act="settings" data-sync>☁ ${esc(syncLabel())}</button>` : ""}
      <button class="icon-btn" data-act="settings" aria-label="설정">⚙</button>
      <button class="btn primary" data-act="newp">+ 새 프로젝트</button></div>
    <div class="list-head">
      <div class="chips" role="group" aria-label="보기">
        <button class="chip" data-act="filter" data-v="active" aria-pressed="${S.filter === "active"}">진행 중 ${act.length}</button>
        <button class="chip" data-act="filter" data-v="done" aria-pressed="${S.filter === "done"}">완료 ${done.length}</button>
        <button class="chip" data-act="filter" data-v="all" aria-pressed="${S.filter === "all"}">전체 ${S.projects.length}</button>
      </div>
    </div>
    ${modeNote}
    ${shown.length ? `<div class="grid">${cards}</div>` : `<div class="empty">${S.filter === "done" ? "아직 완성한 프로젝트가 없어요." : `진행 중인 프로젝트가 없어요.<br><br><button class="btn primary" data-act="newp">+ 새 프로젝트</button>`}</div>`}
    <p class="foot">진행 중인 프로젝트가 있어도 언제든 새 프로젝트를 만들 수 있어요. 도안을 올리면 Claude가 단별 지시와 차트로 정리해요.</p>`;
}

function viewSheet() {
  const sh = S.sheet;
  const canAnalyze = !!S.sample;
  const hasSrc = sh.files.length || (sh.text || "").trim();
  const thumbs = sh.files.map((f, i) => {
    const isImg = IMG_TYPES.includes(f.type);
    const url = isImg ? URL.createObjectURL(f) : "";
    return `<div class="thumb" style="${url ? `background-image:url('${url}')` : ""}">${isImg ? "" : "PDF"}<button type="button" data-act="rmFile" data-v="${i}" aria-label="${esc(f.name)} 빼기">×</button></div>`;
  }).join("");
  return `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <h2 id="shT">새 프로젝트</h2>
    <div class="field"><label class="label" for="sName">이름</label><input type="text" id="sName" value="${esc(sh.name)}" placeholder="비워 두면 도안 이름으로 채워요"></div>
    <div class="row-f">
      <div class="field"><span class="label">도구</span>${seg("craft", sh.craft, CRAFT)}</div>
      <div class="field"><span class="label">뜨는 방식</span>${seg("mode", sh.mode, { flat: "평면뜨기", round: "원형뜨기" })}</div>
    </div>
    <div class="field"><label class="label" for="sSize">사이즈 (선택)</label><input type="text" id="sSize" value="${esc(sh.size || "")}" placeholder="예: XS" style="max-width:200px">
      <span class="muted" style="font-size:12.5px">도안에 적힌 사이즈 이름 그대로 적어 주세요. "82 (87) 92 (98)…"처럼 나열된 숫자에서 이 사이즈 값만 뽑아요. 비워 두면 첫 번째 사이즈로 분석하고, 나중에 도안 탭에서 바꿀 수 있어요.</span></div>
    <div class="field"><span class="label">단 세는 방식</span>${seg("rowMode", sh.rowMode, ROWMODE)}
      <span class="muted" style="font-size:12.5px">${ROWMODE_HELP[sh.rowMode]} 나중에 카운트 화면에서 바꿀 수 있어요.</span></div>
    <div class="field"><span class="label">도안 파일 (PDF·이미지)</span>
      <div class="drop"><button type="button" class="btn primary" data-act="pickFiles">＋ 도안 PDF·이미지 추가</button><div style="margin-top:6px;font-size:13px">또는 여기로 끌어다 놓기 · PDF JPG PNG WEBP</div></div>
      ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ""}
      ${canAnalyze && !S.imgCaps ? `<p class="notice">이 화면에서는 이미지를 Claude에게 보낼 수 없어서, PDF는 글자만 읽어 분석해요. 스캔한 PDF라면 도안 텍스트를 붙여 넣어 주세요.</p>` : ""}
    </div>
    <div class="field"><label class="label" for="sText">도안 텍스트 (선택)</label><textarea id="sText" rows="4" placeholder="서술형 도안을 그대로 붙여 넣어도 돼요. 예) 1단: 겉2 안2 반복…">${esc(sh.text)}</textarea></div>
    ${canAnalyze ? "" : `<p class="notice">도안 분석을 쓰려면 설정에서 Claude API 키를 넣어 주세요. 도안 파일은 지금 저장해 두고 나중에 분석해도 돼요.</p>`}
    <div class="field"><label class="label" for="sTarget">목표 단수 (빈 카운터용, 선택)</label><input type="text" inputmode="numeric" id="sTarget" value="${esc(sh.target || "")}" placeholder="예: 120" style="max-width:160px"></div>
    ${sh.busy ? `<p class="muted dots">${esc(sh.msg || "만드는 중")}</p>` : ""}
    <div class="actions">
      <button class="btn ghost" data-act="closeSheet">취소</button>
      <button class="btn" data-act="create" data-v="blank" ${sh.busy ? "disabled" : ""}>${hasSrc ? "분석 없이 만들기" : "빈 카운터로 만들기"}</button>
      ${canAnalyze ? `<button class="btn primary" data-act="create" data-v="analyze" ${sh.busy || !hasSrc ? "disabled" : ""}>만들고 도안 분석</button>` : ""}
    </div>
  </div></div>`;
}

function viewProject(p) {
  const tabs = [["count", "카운트"], ["chart", "차트"], ["pattern", "도안"], ["memo", "메모"]];
  let body = S.tab === "chart" ? tabChart(p) : S.tab === "pattern" ? tabPattern(p) : S.tab === "memo" ? tabMemo(p) : tabCount(p);
  return `<div class="bar"><button class="icon-btn" data-act="back" aria-label="목록으로">←</button>
      <h1 class="pname">${esc(p.name || "이름 없음")}</h1><span class="sp"></span>
      ${sizeLabel(p) ? `<span class="pill accent">${esc(sizeLabel(p))}</span>` : ""}
      ${p.status === "done" ? `<span class="pill good">완료</span>` : ""}</div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-v="${k}">${l}</button>`).join("")}</div>
    ${analyzingBlock(p)}
    ${body}`;
}
function analyzingBlock(p) {
  const a = S.analyzing[p.id]; if (!a) return "";
  if (a.error) return `<div class="warnbox" style="margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>${esc(a.error)}</span><span style="display:flex;gap:6px"><button class="btn sm" data-act="analyze">다시 분석</button><button class="btn sm ghost" data-act="dismissErr">닫기</button></span></div>`;
  return `<div class="panel analyzing" style="margin-bottom:14px"><div><strong>Claude가 도안을 분석하고 있어요</strong><div class="muted dots" data-analyzing="${esc(p.id)}">${esc(a.status)}</div></div>
    <div class="muted" style="font-size:13px">보통 30초~2분 걸려요. 그동안 카운터는 계속 쓸 수 있어요.</div>
    <button class="btn sm" data-act="stop">중지</button></div>`;
}

function tabCount(p) {
  const secs = sectionsOf(p), g = prog(p), sec = secs[g.sec], row = curRow(p);
  const tot = secTotal(p, sec), st = stepAt(sec, row), nx = nextStep(sec, row);
  const ctx = chartCtx(p);
  const secBar = secs.length > 1 ? `<div class="secbar chips" role="group" aria-label="부위">${secs.map((s, i) => `<button class="chip" data-act="sec" data-v="${i}" aria-pressed="${i === g.sec}">${esc(s.name)} <span class="num">${g.rows[i] || 1}</span></button>`).join("")}</div>` : "";
  const over = tot && row > tot;
  const target = st && st.stitches;
  const segMode = p.rowMode === "segment";
  const segs = segmentsOf(p, sec, g.sec), sg = segAt(segs, row);
  const useSeg = segMode && sg && !sg.implicit;
  const bigN = useSeg ? segLocal(sg, row) : row, bigOf = useSeg ? segLen(sg) : tot;
  const rng = s => useSeg && sg ? (s.from === s.to ? segLocal(sg, s.from) + "단" : segLocal(sg, Math.max(s.from, sg.from)) + "–" + segLocal(sg, Math.min(s.to, sg.to ?? s.to)) + "단")
    : (s.from === s.to ? s.from + "단" : s.from + "–" + s.to + "단");
  const segDone = segMode && sec.manual && sg && !sg.implicit && sg.to != null && row > sg.to;
  const nxSegName = nx && segMode ? (segAt(segs, nx.from) || {}).name : null;
  const modeBar = `<div class="minirow" style="margin-bottom:12px"><div class="seg" role="group" aria-label="단 세는 방식">${Object.entries(ROWMODE).map(([k, l]) => `<button type="button" data-act="rowMode" data-v="${k}" aria-pressed="${(p.rowMode || "total") === k}">${l}</button>`).join("")}</div>
    ${segMode && sec.manual ? `<button class="btn sm" data-act="segForm" aria-expanded="${!!S.segForm}">+ 새 구간 시작</button>` : ""}</div>
    ${segMode && sec.manual && S.segForm ? `<div class="panel" style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="flex:1;min-width:160px"><label class="label" for="segName">구간 이름 · ${row}단부터</label><input type="text" id="segName" placeholder="예: 요크 늘리기" style="border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px"></div>
      <div class="field" style="width:110px"><label class="label" for="segRows">단수 (선택)</label><input type="text" inputmode="numeric" id="segRows" placeholder="24" style="border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;width:100%"></div>
      <button class="btn primary sm" data-act="addSeg">시작</button><button class="btn sm ghost" data-act="segForm">취소</button></div>` : ""}
    ${segMode && segs.length > 1 ? `<div class="segstrip" aria-label="구간 진행">${segs.map(s => {
      const state = s === sg ? "cur" : (s.to != null && row > s.to) ? "done" : "todo";
      const len = segLen(s);
      return `<span class="sgp ${state}">${state === "done" ? "✓ " : ""}${esc(s.name)}${state === "cur" ? ` <span class="num">${segLocal(s, row)}${len ? "/" + len : ""}</span>` : len ? ` <span class="num">${len}</span>` : ""}</span>`; }).join("")}</div>` : ""}`;
  const chartBit = ctx ? `<div class="panel"><div class="chart-title"><h3>${esc(ctx.ch.name)}</h3><span class="muted num" style="font-size:12.5px">차트 ${ctx.chartRow}단 · ${ctx.rtl ? "← 오른쪽부터" : "→ 왼쪽부터"} · ${ctx.repeat}번째 반복</span></div>${chartGrid(p, ctx.ch, ctx)}</div>` : "";
  return `${secBar}${modeBar}
  ${segDone ? `<div class="done-banner" style="margin-bottom:12px"><span>${esc(sg.name)} ${segLen(sg)}단 완료</span><button class="btn sm" data-act="segForm">+ 새 구간 시작</button></div>` : ""}
  ${over ?`<div class="done-banner" style="margin-bottom:12px"><span>${esc(sec.name)} ${tot}단 완료</span>${g.sec < secs.length - 1 ? `<button class="btn sm" data-act="nextSec">다음 부위: ${esc(secs[g.sec + 1].name)} →</button>` : `<button class="btn sm" data-act="status">${p.status === "done" ? "진행 중으로 되돌리기" : "프로젝트 완료로 표시"}</button>`}</div>` : ""}
  <div class="counter">
    <div class="panel rowpanel">
      <div class="minirow"><span class="label">${useSeg ? esc(sg.name) + " · 단" : esc(sec.manual ? "단" : sec.name + " · 단")}</span>
        ${useSeg ? `<span class="muted num" style="font-size:12.5px">${esc(sec.manual ? "전체" : sec.name + " 전체")} ${row}${tot ? " / " + tot : ""}단</span>`
          : sec.manual && !tot && !segMode ? `<span class="muted" style="font-size:12.5px">목표 단수는 도안 탭에서 정할 수 있어요</span>` : ""}</div>
      <div class="bignum"><span class="n" aria-live="polite">${bigN}</span><span class="u">단</span>${bigOf ? `<span class="of">/ ${bigOf}</span>` : ""}</div>
      ${segMode && sec.manual && !useSeg ? `<p class="muted" style="font-size:13px;margin:0">구간을 시작하면 그 구간 안에서 1단부터 세요. 예: 소매 코 늘리기 → 요크 늘리기</p>` : ""}
      ${st ? `<div class="instr"><span class="r">${rng(st)}${target ? ` · 마치면 ${target}코` : ""}</span>${esc(st.text)}</div>`
        : !sec.manual && !over ? `<div class="instr"><span class="r">${row}단</span>이 단에 해당하는 지시가 없어요. 도안 탭에서 확인해 주세요.</div>` : ""}
      <div class="pad">
        <button class="tap" data-act="rowMinus" ${row <= 1 ? "disabled" : ""} aria-label="한 단 빼기">− 1단</button>
        <button class="tap big" data-act="rowPlus" aria-label="한 단 완료">+ 1단 완료</button>
      </div>
      ${nx ? `<div class="next">다음 지시 · ${useSeg && nxSegName && nxSegName !== sg.name ? `<span class="num">${sg.to - row + 1}단</span> 뒤 <b>${esc(nxSegName)}</b> 구간 시작: ` : `<span class="num">${useSeg && sg ? segLocal(sg, nx.from) : nx.from}단</span>부터: `}<b>${esc(nx.text)}</b></div>` : ""}
    </div>
    <div class="panel stpanel">
      <div class="minirow"><span class="label">이 단에서 뜬 코</span><button class="btn sm ghost" data-act="stReset">0으로</button></div>
      <div class="stnum"><span class="n">${g.stitch}</span><span class="muted">코${target ? ` / <span class="num">${target}</span>` : ""}</span></div>
      <div class="stbtns">
        <button class="tap" data-act="st" data-v="-1" aria-label="한 코 빼기">−1</button>
        <button class="tap plus" data-act="st" data-v="1">+1</button>
        <button class="tap" data-act="st" data-v="5">+5</button>
        <button class="tap" data-act="st" data-v="10">+10</button>
      </div>
      <div class="minirow" style="border-top:1px solid var(--line);padding-top:10px">
        <span class="label">보조 카운터</span>
        <span class="aux"><button class="icon-btn" data-act="aux" data-v="-1" aria-label="보조 빼기">−</button><span class="n">${g.aux}</span><button class="icon-btn" data-act="aux" data-v="1" aria-label="보조 더하기">+</button><button class="btn sm ghost" data-act="aux" data-v="0">0</button></span>
      </div>
      <div class="minirow">
        <button class="btn sm" data-act="undo" ${(S.hist[p.id] || []).length ? "" : "disabled"}>↶ 되돌리기</button>
        <button class="btn sm" data-act="wake" aria-pressed="${!!S.wake}">${S.wake ? "화면 켜두는 중" : "화면 켜두기"}</button>
      </div>
      <p class="muted kbd" style="font-size:12px;margin:0">키보드: ↑ 단 완료 · ↓ 단 빼기 · → 코 +1 · ← 코 −1</p>
    </div>
  </div>
  ${chartBit ? `<div style="margin-top:12px">${chartBit}</div>` : !p.pattern && !S.analyzing[p.id] ? `<p class="notice" style="margin-top:12px">도안을 올리면 단별 지시와 차트가 여기에 함께 보여요. <button class="btn sm" data-act="tab" data-v="pattern">도안 추가하기</button></p>` : ""}`;
}

function chartGrid(p, ch, ctx) {
  const legend = {}; (p.pattern.legend || []).forEach(l => legend[l.key] = l);
  const w = ch.width;
  let cells = "";
  const colNum = i => `<div class="cc cn">${(w - i) % 5 === 0 || w - i === 1 ? (w - i) : ""}</div>`;
  for (let r = ch.height; r >= 1; r--) {
    const line = ch.rows[r - 1] || "";
    const isCur = ctx && ctx.chartRow === r;
    const rtlRow = ch.direction === "rtl" || (ch.direction === "rtl-alt" && r % 2 === 1) || (ch.direction === "ltr-alt" && r % 2 === 0);
    const rnCls = "cc rn" + (isCur ? " cur-row" : "");
    cells += `<div class="${rnCls}" ${isCur ? 'data-cur="1"' : ""}>${!rtlRow ? r : ""}</div>`;
    for (let c = 0; c < w; c++) {
      const k = line[c] || "_", L = legend[k];
      const cls = "cc" + (isCur ? " cur-row" : "") + (isCur && ctx.cell === c ? " cur-cell" : "");
      const bg = L && L.color ? `background:${L.color};color:${contrast(L.color)}` : k === "_" ? "background:var(--surface-2);color:var(--ink-2)" : "";
      cells += `<div class="${cls}" style="${bg}" title="${esc(L ? L.label : k)}">${esc(L ? L.glyph : k === "_" ? "" : k)}</div>`;
    }
    cells += `<div class="${rnCls}">${rtlRow ? r : ""}</div>`;
  }
  cells += `<div class="cc cn"></div>` + Array.from({ length: w }, (_, i) => colNum(i)).join("") + `<div class="cc cn"></div>`;
  return `<div class="chart-wrap" data-chart="${esc(ch.id)}"><div class="chart" style="grid-template-columns:26px repeat(${w},var(--cell)) 26px">${cells}</div></div>
    <div class="legend">${(p.pattern.legend || []).filter(l => ch.rows.some(r => r.includes(l.key))).map(l => `<span><span class="cc" style="${l.color ? `background:${l.color};color:${contrast(l.color)}` : ""}">${esc(l.glyph)}</span>${esc(l.label)}</span>`).join("")}</div>`;
}
function contrast(hex) {
  let h = hex.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h.slice(0, 6), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? "#1B2420" : "#FFFFFF";
}
function scrollChart() {
  const sc = document.querySelector(".segstrip .sgp.cur");
  if (sc) { const w = sc.parentElement; w.scrollLeft = Math.max(0, sc.offsetLeft - w.offsetLeft - 16); }
  document.querySelectorAll(".chart-wrap").forEach(w => {
    const c = w.querySelector('[data-cur="1"]'); if (!c) return;
    w.scrollTop = Math.max(0, c.offsetTop - w.clientHeight / 2);
    const cell = w.querySelector(".cur-cell");
    if (cell) w.scrollLeft = Math.max(0, cell.offsetLeft - w.clientWidth / 2);
  });
}

function tabChart(p) {
  const charts = p.pattern && p.pattern.charts || [];
  if (!charts.length) return `<p class="notice">${p.pattern ? "이 도안에는 칸 차트가 없어요. 서술형 지시는 카운트 탭과 도안 탭에서 볼 수 있어요." : "아직 분석한 도안이 없어요."} <button class="btn sm" data-act="tab" data-v="pattern">도안 탭으로</button></p>`;
  const ctx = chartCtx(p);
  return `<div class="stack">${charts.map(ch => `<div class="panel"><div class="chart-title"><h3>${esc(ch.name)}</h3><span class="muted num" style="font-size:12.5px">${ch.width}코 × ${ch.height}단 · ${{ "rtl-alt": "홀수단 ←, 짝수단 →", rtl: "모든 단 ←", "ltr-alt": "홀수단 →, 짝수단 ←", ltr: "모든 단 →" }[ch.direction]}</span></div>
    ${chartGrid(p, ch, ctx && ctx.ch.id === ch.id ? ctx : null)}</div>`).join("")}
    <p class="muted" style="font-size:12.5px">노란 줄이 지금 뜨는 단, 굵은 테두리 칸이 다음에 뜰 코예요 (코 카운터 기준).</p></div>`;
}

function tabPattern(p) {
  const pat = p.pattern, g = prog(p), row = curRow(p), busy = !!(S.analyzing[p.id] && !S.analyzing[p.id].error);
  const srcCount = (p.imageIds || []).length || (S.blobs[p.id] || []).length;
  const imgs = (p.imageIds || []).map(id => (p.fileTypes || {})[id] === "application/pdf"
    ? `<div class="thumb" style="height:160px;width:120px;place-items:center">PDF</div>`
    : `<img data-file="${esc(id)}" alt="도안 원본">`).join("");
  const settings = `<div class="panel stack">
      <div class="field"><label class="label" for="pName">프로젝트 이름</label><input type="text" id="pName" value="${esc(p.name)}"></div>
      <div class="field"><label class="label" for="pSize">사이즈</label><input type="text" id="pSize" value="${esc(p.size || "")}" placeholder="예: XS" style="max-width:200px">
        <span class="muted" style="font-size:12.5px">바꾼 뒤 "다시 분석"을 누르면 그 사이즈의 단수·콧수로 새로 뽑아요.</span></div>
      <div class="row-f"><div class="field"><span class="label">도구</span>${seg("craft", p.craft, CRAFT)}</div>
      <div class="field"><span class="label">뜨는 방식</span>${seg("mode", p.mode, { flat: "평면뜨기", round: "원형뜨기" })}</div>
      ${!pat ? `<div class="field"><label class="label" for="pTarget">목표 단수</label><input type="text" inputmode="numeric" id="pTarget" value="${esc(p.targetRows || "")}" style="max-width:120px"></div>` : ""}</div>
      <div class="field"><span class="label">단 세는 방식</span>${seg("rowMode", p.rowMode || "total", ROWMODE)}<span class="muted" style="font-size:12.5px">${ROWMODE_HELP[p.rowMode || "total"]}</span></div>
      ${!pat && (p.manualSegs || []).length ? `<div class="field"><span class="label">내가 만든 구간</span><ul class="steps">${p.manualSegs.slice().sort((a, b) => a.from - b.from).map(m => `<li><div class="segitem"><span class="rg">${m.from}단부터</span><span>${esc(m.name)}${m.rows ? ` <span class="muted num">${m.rows}단</span>` : ""}</span><button class="btn sm ghost" data-act="delSeg" data-v="${esc(m.id)}">삭제</button></div></li>`).join("")}</ul></div>` : ""}
    </div>`;
  const source = `<div class="panel stack">
      <div class="minirow"><span class="label">원본 도안</span>
        <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="addSrc">＋ 도안 PDF·이미지 추가</button>
        ${S.sample ? `<button class="btn sm primary" data-act="analyze" ${busy ? "disabled" : ""}>${pat ? "처음부터 다시 분석" : "도안 분석하기"}</button>` : ""}</span></div>
      ${imgs ? `<div class="srcimgs">${imgs}</div>` : srcCount ? `<p class="muted" style="font-size:13px">이미지 ${srcCount}장 (이번 세션에만 보관돼요)</p>` : ""}
      ${p.sourceText ? `<details><summary class="muted" style="cursor:pointer;font-size:13px">도안 텍스트 보기 (${p.sourceText.length.toLocaleString()}자)</summary><pre style="white-space:pre-wrap;font-size:13px;max-height:260px;overflow:auto">${esc(p.sourceText)}</pre></details>` : ""}
      ${!imgs && !srcCount && !p.sourceText ? `<p class="muted" style="font-size:13px">아직 올린 도안이 없어요.</p>` : ""}
      ${!S.sample ? `<p class="notice">도안 분석을 쓰려면 설정에서 Claude API 키와 모델을 정해 주세요. <button class="btn sm" data-act="settings">설정 열기</button></p>` : ""}
    </div>`;
  let analysis = "";
  if (pat) {
    const m = pat.materials || {};
    const mats = [["실", m.yarn], ["바늘", m.needle], ["게이지", m.gauge], ["완성 크기", m.size]].filter(x => x[1]);
    analysis = `
    ${pat.warnings && pat.warnings.length ? `<div class="warnbox"><strong>확인이 필요한 부분</strong><ul>${pat.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    ${sizePanel(p, busy)}
    <div class="panel stack">
      ${pat.summary ? `<p style="margin:0">${esc(pat.summary)}</p>` : ""}
      ${mats.length ? `<dl class="kv">${mats.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
    </div>
    ${pat.sections.map((s, si) => { const segs = segmentsOf(p, s, si), segMode = p.rowMode === "segment";
      return `<div class="sec"><h3>${esc(s.name)} <span class="muted num" style="font-size:13px;font-weight:400">${secTotal(p, s)}단</span></h3>
      <ul class="steps">${s.steps.map((st, i) => { const on = si === g.sec && row >= st.from && row <= st.to;
        const sg = segAt(segs, st.from), head = segMode && sg && sg.from === st.from && (i === 0 || segAt(segs, s.steps[i - 1].from) !== sg);
        const r = segMode && sg ? (st.from === st.to ? segLocal(sg, st.from) + "단" : segLocal(sg, st.from) + "–" + segLocal(sg, st.to) + "단") : (st.from === st.to ? st.from + "단" : st.from + "–" + st.to + "단");
        return `${head ? `<li class="seghead"><span>${esc(sg.name)}</span><span class="num">${segLen(sg)}단 · 전체 ${sg.from}–${sg.to}단</span></li>` : ""}<li class="${on ? "on" : ""}"><button data-act="jump" data-v="${si}:${st.from}"><span class="rg">${r}</span><span>${esc(st.text)}${st.chart ? ` <span class="pill accent">차트</span>` : ""}</span><span class="sc">${st.stitches ? st.stitches + "코" : ""}</span></button></li>`; }).join("")}</ul></div>`; }).join("")}
    <p class="muted" style="font-size:12.5px;margin:0">단 범위를 누르면 그 단으로 이동해요. Claude가 만든 분석이라 원본 도안과 꼭 대조해 주세요.</p>
    ${S.sample ? `<div class="panel stack"><label class="label" for="fixReq">분석 고치기</label>

      <div><button class="btn sm primary" data-act="fix" ${busy ? "disabled" : ""}>Claude에게 수정 요청</button></div></div>` : ""}`;
  }
  const danger = `<div class="minirow" style="margin-top:6px">
      <button class="btn sm" data-act="status">${p.status === "done" ? "진행 중으로 되돌리기" : "완료로 표시"}</button>
      <button class="btn sm danger" data-act="del">${S.confirmDel ? "한 번 더 누르면 삭제돼요" : "프로젝트 삭제"}</button></div>`;
  return `<div class="stack">${analysis}${source}${settings}${danger}</div>`;
}

function sizePanel(p, busy) {
  const z = p.pattern && p.pattern.size;
  if (!z || (!z.sizes.length && !z.chosen && !z.measurements.length)) return "";
  const want = (p.size || "").toUpperCase(), chosen = (z.chosen || "").toUpperCase();
  const stale = want && want !== chosen;
  return `<div class="panel stack">
    <div class="minirow"><span class="label">사이즈</span>${z.chosen ? `<span class="muted" style="font-size:12.5px">지금 분석: <b style="color:var(--ink)">${esc(z.chosen)}</b>${z.index ? ` · ${z.index}번째 값` : ""}</span>` : ""}</div>
    ${z.sizes.length > 1 ? `<div class="chips" role="group" aria-label="사이즈 고르기">${z.sizes.map((x, i) => `<button class="chip" data-act="pickSize" data-v="${esc(x)}" aria-pressed="${(want || chosen) === x.toUpperCase()}"><span class="num" style="opacity:.6">${i + 1}</span> ${esc(x)}</button>`).join("")}</div>` : ""}
    ${z.measurements.length ? `<dl class="kv">${z.measurements.map(m => `<dt>${esc(m.label)}</dt><dd class="num">${esc(m.value)}</dd>`).join("")}</dl>
      <p class="muted" style="font-size:12.5px;margin:0">원본 도안의 치수 표에서 이 값이 내 사이즈 열과 같은지 확인해 주세요.</p>` : ""}
    ${stale && S.sample ? `<div class="minirow" style="background:var(--mark-soft);border-radius:10px;padding:8px 10px"><span>${esc(p.size)} 사이즈 숫자로 바꾸려면 다시 분석해야 해요. 진행 중인 단 위치는 그대로 둬요.</span><button class="btn sm primary" data-act="analyze" ${busy ? "disabled" : ""}>${esc(p.size)}로 다시 분석</button></div>` : ""}
  </div>`;
}
function viewSettings() {
  const key = pref("apiKey"), model = pref("model");
  const masked = key ? key.slice(0, 10) + "…" + key.slice(-4) : "";
  const models = S.models || (model ? [{ id: model, name: model }] : []);
  return `<div class="bar"><button class="icon-btn" data-act="back" aria-label="목록으로">←</button><h1 class="pname">설정</h1></div>
  <div class="stack">
    <div class="panel stack">
      <span class="label">계정 동기화</span>
      ${!syncReady() ? `<p class="notice">동기화 서버 설정(config.js)이 아직 비어 있어요. 관리자가 설정하면 구글 로그인을 쓸 수 있어요.</p>`
        : !Sync.session ? `<p style="margin:0">구글 계정으로 로그인하면 웹과 앱에서 같은 프로젝트를 쓰고, 폰을 바꾸거나 앱을 지워도 프로젝트를 되찾을 수 있어요.</p>
          <div><button class="btn primary" data-act="login">G 구글로 로그인</button></div>
          <p class="muted" style="font-size:12.5px;margin:0">구글 비밀번호는 구글 화면에서만 입력해요. 이 앱은 비밀번호를 볼 수 없고, 이메일 주소만 받아요. 로그인하지 않으면 지금처럼 이 기기에만 저장돼요.</p>`
        : `<p style="margin:0"><b>${esc(Sync.session.email || "구글 계정")}</b>으로 로그인했어요.</p>
          <p class="muted num" style="font-size:12.5px;margin:0">${Sync.busy ? "동기화 중…" : Sync.lastAt ? "마지막 동기화: " + new Date(Sync.lastAt).toLocaleString("ko-KR") : "아직 동기화 전"}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" data-act="syncNow" ${Sync.busy ? "disabled" : ""}>지금 동기화</button><button class="btn sm" data-act="logout">로그아웃</button></div>`}
      ${Sync.status ? `<p class="muted" style="font-size:13px;margin:0">${esc(Sync.status)}</p>` : ""}
      <p class="muted" style="font-size:12.5px;margin:0">동기화되는 것: 프로젝트, 진행 위치, 분석 결과·차트, 메모. 동기화되지 않는 것: 원본 도안 파일, Claude API 키(기기마다 따로 넣어요).</p>
    </div>
    <div class="panel stack">
      <span class="label">Claude API 키</span>
      ${key ? `<p class="setting-key" style="margin:0">저장된 키: ${esc(masked)}</p>` : ""}
      <input type="password" id="apiKey" class="plain" autocomplete="off" placeholder="${key ? "새 키로 바꾸려면 붙여 넣기" : "sk-ant-로 시작하는 키 붙여 넣기"}" style="border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-act="saveKey">키 저장하고 연결 확인</button>${key ? `<button class="btn sm danger" data-act="clearKey">키 지우기</button>` : ""}</div>
      ${S.keyStatus ? `<p class="muted" style="font-size:13px;margin:0">${esc(S.keyStatus)}</p>` : ""}
      <p class="muted" style="font-size:12.5px;margin:0">키는 Anthropic 콘솔에서 만들 수 있어요. API 키가 없으면 도안 분석만 쓸 수 없고, 나머지 기능은 모두 쓸 수 있어요. API 요금은 Claude 구독과 별개로, 분석에 쓴 만큼 청구돼요. 콘솔에서 월 사용 한도를 정해 두면 한도를 넘었을 때 도안 분석만 멈추고, 카운터·차트·저장은 계속 쓸 수 있어요. 키는 이 기기 안에만 저장되고 동기화 서버로 보내지 않아요.</p>
    </div>
    <div class="panel stack">
      <label class="label" for="modelSel">분석에 쓸 모델</label>
      ${models.length ? `<select id="modelSel" class="plain">${models.map(m => `<option value="${esc(m.id)}" ${m.id === model ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>` : `<p class="muted" style="margin:0;font-size:13px">키를 저장하면 쓸 수 있는 모델 목록을 불러와요.</p>`}
      <div><button class="btn sm" data-act="loadModels" ${key && !S.modelsBusy ? "" : "disabled"}>${S.modelsBusy ? "불러오는 중…" : "모델 목록 새로 불러오기"}</button></div>
      <p class="muted" style="font-size:12.5px;margin:0">도안 읽기는 Sonnet급 모델을 권해요. 더 정확한 모델일수록 분석 요금이 올라가요.</p>
    </div>
    <div class="panel stack">
      <span class="label">백업</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="exportData">백업 파일 저장</button><button class="btn sm" data-act="importData">백업 불러오기</button></div>
      <p class="muted" style="font-size:12.5px;margin:0">프로젝트·진행 위치·분석 결과·메모를 JSON 파일로 저장해요 (앱은 Download 폴더). 원본 도안 파일은 백업에 들어가지 않아요. 불러올 때는 같은 프로젝트면 더 최근 것만 덮어써요.</p>
    </div>
    <p class="foot">한코한단 ${IS_ANDROID ? "안드로이드" : "웹"} 1.1</p>
  </div>`;
}
function tabMemo(p) {
  return `<div class="stack"><label class="label" for="notes">메모</label>
    <textarea id="notes" class="plain" rows="12" placeholder="바늘 호수 바꾼 곳, 콧수 수정, 실 로트 번호 등">${esc(p.notes || "")}</textarea>
    <p class="muted" style="font-size:12.5px">자동 저장돼요.</p></div>`;
}

initStore();
})();
</script>

</body>
</html>
